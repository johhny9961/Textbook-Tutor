kind = "web"
previewPath = "/"
title = "TrailReader"
version = "1.0.0"
id = "artifacts/trailreader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22827

[services.development]
run = "pnpm --filter @workspace/trailreader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trailreader", "run", "build" ]
publicDir = "artifacts/trailreader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22827"
BASE_PATH = "/"
